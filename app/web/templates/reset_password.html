{% extends "base.html" %}
{% block title %}Nueva contraseña — Parsero{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-16">
  <h1 class="text-3xl font-bold text-center mb-8">Definir nueva contraseña</h1>
  <form method="post" action="/reset-password" class="bg-white p-8 rounded-xl border border-slate-200 space-y-4">
    <input type="hidden" name="token" value="{{ token }}">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Nueva contraseña</label>
      <input type="password" name="new_password" required minlength="8" maxlength="128"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900">
      <p class="text-xs text-slate-500 mt-1">Mínimo 8 caracteres.</p>
    </div>
    <button type="submit" class="w-full px-4 py-3 bg-slate-900 text-white rounded-lg font-medium hover:bg-slate-800">
      Cambiar contraseña
    </button>
  </form>
</section>
{% endblock %}
