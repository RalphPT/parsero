{% extends "base.html" %}
{% block title %}Recuperar contraseña - Parsero{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-16 sm:py-20">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-extrabold tracking-tight">Recuperar contraseña</h1>
    <p class="mt-2 text-sm text-slate-500 dark:text-slate-500">Te enviaremos un link para definir una nueva.</p>
  </div>

  <form method="post" action="/forgot-password" class="bg-white dark:bg-slate-900 p-8 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-5">
    <div>
      <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
      <input type="email" name="email" required
             class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-shadow">
    </div>
    <button type="submit" class="w-full px-4 py-3 bg-slate-900 text-white rounded-lg font-semibold hover:bg-slate-800 transition-colors">
      Enviar email
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
    <a href="/login" class="font-semibold text-slate-900 dark:text-white hover:underline">Volver al login</a>
  </p>
</section>
{% endblock %}
