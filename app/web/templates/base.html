<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Parsero{% endblock %}</title>
  <meta name="description" content="API SaaS para extraer datos estructurados de facturas, CVs y recibos con IA.">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <header class="border-b border-slate-200 bg-white">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="text-xl font-bold tracking-tight text-slate-900">
        Parsero
      </a>
      <nav class="flex items-center gap-6 text-sm">
        <a href="/pricing" class="text-slate-600 hover:text-slate-900">Pricing</a>
        <a href="/docs" class="text-slate-600 hover:text-slate-900">API Docs</a>
        {% if tenant %}
          <a href="/dashboard" class="text-slate-600 hover:text-slate-900">Dashboard</a>
          <form method="post" action="/logout" class="inline">
            <button type="submit" class="text-slate-600 hover:text-slate-900">Logout</button>
          </form>
        {% else %}
          <a href="/login" class="text-slate-600 hover:text-slate-900">Login</a>
          <a href="/signup" class="px-4 py-2 bg-slate-900 text-white rounded-lg hover:bg-slate-800">
            Sign up
          </a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="flex-1">
    {% if flash_error %}
      <div class="max-w-6xl mx-auto px-4 mt-4">
        <div class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg">
          {{ flash_error }}
        </div>
      </div>
    {% endif %}
    {% if flash_success %}
      <div class="max-w-6xl mx-auto px-4 mt-4">
        <div class="bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg">
          {{ flash_success }}
        </div>
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-200 bg-white mt-12">
    <div class="max-w-6xl mx-auto px-4 py-6 text-sm text-slate-500 flex justify-between">
      <span>© 2026 Parsero</span>
      <div class="flex gap-4">
        <a href="/pricing" class="hover:text-slate-900">Pricing</a>
        <a href="/docs" class="hover:text-slate-900">API</a>
      </div>
    </div>
  </footer>
</body>
</html>
