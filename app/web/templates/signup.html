{% extends "base.html" %}
{% block title %}Crear cuenta — Parsero{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-16">
  <h1 class="text-3xl font-bold text-center mb-8">Crear cuenta</h1>
  <form method="post" action="/signup" class="bg-white p-8 rounded-xl border border-slate-200 space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
      <input type="text" name="name" required minlength="2" maxlength="120"
             value="{{ form_name|default('') }}"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
      <input type="email" name="email" required
             value="{{ form_email|default('') }}"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
      <input type="password" name="password" required minlength="8" maxlength="128"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900">
      <p class="text-xs text-slate-500 mt-1">Mínimo 8 caracteres.</p>
    </div>
    <button type="submit" class="w-full px-4 py-3 bg-slate-900 text-white rounded-lg font-medium hover:bg-slate-800">
      Crear cuenta gratis
    </button>
  </form>
  <p class="mt-4 text-center text-sm text-slate-600">
    ¿Ya tenés cuenta? <a href="/login" class="text-slate-900 underline">Iniciar sesión</a>
  </p>
</section>
{% endblock %}
