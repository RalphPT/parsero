{% extends "base.html" %}
{% block title %}Recuperar contraseña — Parsero{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-16">
  <h1 class="text-3xl font-bold text-center mb-8">Recuperar contraseña</h1>
  <form method="post" action="/forgot-password" class="bg-white p-8 rounded-xl border border-slate-200 space-y-4">
    <p class="text-sm text-slate-600">Te enviaremos un email con un link para definir una nueva contraseña.</p>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
      <input type="email" name="email" required
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900">
    </div>
    <button type="submit" class="w-full px-4 py-3 bg-slate-900 text-white rounded-lg font-medium hover:bg-slate-800">
      Enviar email
    </button>
  </form>
  <p class="mt-4 text-center text-sm text-slate-600">
    <a href="/login" class="text-slate-900 underline">Volver a iniciar sesión</a>
  </p>
</section>
{% endblock %}
