{% extends "base.html" %}
{% block title %}Iniciar sesión — Parsero{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-16">
  <h1 class="text-3xl font-bold text-center mb-8">Iniciar sesión</h1>
  <form method="post" action="/login" class="bg-white p-8 rounded-xl border border-slate-200 space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
      <input type="email" name="email" required value="{{ form_email|default('') }}"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
      <input type="password" name="password" required
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900">
    </div>
    <button type="submit" class="w-full px-4 py-3 bg-slate-900 text-white rounded-lg font-medium hover:bg-slate-800">
      Iniciar sesión
    </button>
    <p class="text-center text-sm">
      <a href="/forgot-password" class="text-slate-600 underline">¿Olvidaste tu contraseña?</a>
    </p>
  </form>
  <p class="mt-4 text-center text-sm text-slate-600">
    ¿No tienes cuenta? <a href="/signup" class="text-slate-900 underline">Crear una</a>
  </p>
</section>
{% endblock %}
