{% extends "base.html" %}
{% block title %}Crear cuenta - Parsero{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-16 sm:py-20">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-extrabold tracking-tight">Crear cuenta</h1>
    <p class="mt-2 text-sm text-slate-500 dark:text-slate-500">10 requests/min gratis. Sin tarjeta.</p>
  </div>

  <form method="post" action="/signup" class="bg-white dark:bg-slate-900 p-8 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-5">
    <div>
      <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Nombre</label>
      <input type="text" name="name" required minlength="2" maxlength="120"
             value="{{ form_name|default('') }}"
             class="w-full px-3 py-2.5 bg-white dark:bg-slate-950 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 placeholder:text-slate-400 dark:placeholder:text-slate-600 transition-shadow">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
      <input type="email" name="email" required
             value="{{ form_email|default('') }}"
             class="w-full px-3 py-2.5 bg-white dark:bg-slate-950 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 placeholder:text-slate-400 dark:placeholder:text-slate-600 transition-shadow">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Contraseña</label>
      <input type="password" name="password" required minlength="8" maxlength="128"
             class="w-full px-3 py-2.5 bg-white dark:bg-slate-950 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 placeholder:text-slate-400 dark:placeholder:text-slate-600 transition-shadow">
      <p class="text-xs text-slate-500 dark:text-slate-500 mt-1.5">Mínimo 8 caracteres.</p>
    </div>
    <button type="submit" class="w-full px-4 py-3 bg-slate-900 text-white rounded-lg font-semibold hover:bg-slate-800 transition-colors">
      Crear cuenta gratis
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
    ¿Ya tienes cuenta? <a href="/login" class="font-semibold text-slate-900 dark:text-white hover:underline">Iniciar sesión</a>
  </p>
</section>
{% endblock %}
