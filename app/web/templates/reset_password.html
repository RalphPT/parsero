{% extends "base.html" %}
{% block title %}Nueva contraseña — Parsero{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-16 sm:py-20">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-extrabold tracking-tight">Nueva contraseña</h1>
    <p class="mt-2 text-sm text-slate-500">Define una nueva contraseña para tu cuenta.</p>
  </div>

  <form method="post" action="/reset-password" class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-5">
    <input type="hidden" name="token" value="{{ token }}">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nueva contraseña</label>
      <input type="password" name="new_password" required minlength="8" maxlength="128"
             class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-shadow">
      <p class="text-xs text-slate-500 mt-1.5">Mínimo 8 caracteres.</p>
    </div>
    <button type="submit" class="w-full px-4 py-3 bg-slate-900 text-white rounded-lg font-semibold hover:bg-slate-800 transition-colors">
      Cambiar contraseña
    </button>
  </form>
</section>
{% endblock %}
